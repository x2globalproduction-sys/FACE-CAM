<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TYRONEX PRODUCTION - Admin Control Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="https://i.postimg.cc/ncYCzHKZ/new-logo-1.png" alt="Logo">
      <h1>TYRONEX PRODUCTION - Control Room</h1>
    </div>
    <nav class="nav-menu">
      <button class="active" onclick="switchTab('home')">Home</button>
      <button onclick="switchTab('facecam')">Face-Cam</button>
      <button onclick="switchTab('setting')">Setting</button>
    </nav>
  </header>

  <!-- Login Overlay for Admin Credentials Check -->
  <div id="admin-login-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; display:flex; justify-content:center; align-items:center;">
    <div style="background:var(--panel-bg); padding:30px; border-radius:8px; width:350px; border:1px solid var(--border-color);">
      <h3>Admin Sign In</h3>
      <input type="email" id="admin-email" placeholder="email" value="tyronex.tanim@tyronex.com" style="width:100%; padding:8px; margin-bottom:10px; background:#000; color:#fff; border:1px solid var(--border-color);">
      <input type="password" id="admin-pass" placeholder="password" value="2011.01.09" style="width:100%; padding:8px; margin-bottom:15px; background:#000; color:#fff; border:1px solid var(--border-color);">
      <button onclick="verifyAdmin()" style="width:100%; padding:10px; background:var(--accent-red); color:#fff; border:none; font-weight:bold; cursor:pointer;">Login</button>
    </div>
  </div>

  <div class="container" id="app-container" style="display:none;">
    <!-- HOME TAB -->
    <div id="tab-home" class="tab-content">
      <h2>Live System Summary</h2>
      <div style="display:flex; gap:20px; margin-top:20px;">
        <div style="background:var(--panel-bg); padding:20px; border-radius:6px; flex:1; border:1px solid var(--border-color);">
          <h3>Online Face-Cams</h3>
          <p id="count-online" style="font-size:2rem; color:var(--accent-green); margin:0;">0</p>
        </div>
        <div style="background:var(--panel-bg); padding:20px; border-radius:6px; flex:1; border:1px solid var(--border-color);">
          <h3>Offline Face-Cams</h3>
          <p id="count-offline" style="font-size:2rem; color:var(--accent-red); margin:0;">0</p>
        </div>
      </div>
    </div>

    <!-- FACE-CAM TAB (Matches Your Screenshot Designs) -->
    <div id="tab-facecam" class="tab-content" style="display:none;">
      <!-- Toolbar controls matching screenshot elements -->
      <div class="control-toolbar">
        <button>All</button>
        <button>Offline</button>
        <button>Disabled</button>
        <button>No frame</button>
        <button>Poor quality</button>
      </div>

      <div id="groups-container">
        <!-- Rendered dynamically via Socket.io -->
      </div>
    </div>

    <!-- SETTING TAB -->
    <div id="tab-setting" class="tab-content" style="display:none;">
      <h2>User & Group Configuration</h2>
      <div style="background:var(--panel-bg); padding:20px; border-radius:6px; border:1px solid var(--border-color);">
        <h3>Add / Edit Talent (UID, IGN, Secret, Group)</h3>
        <input type="text" id="set-uid" placeholder="UID" style="padding:8px; margin-right:10px; background:#000; color:#fff; border:1px solid var(--border-color);">
        <input type="text" id="set-ign" placeholder="IGN" style="padding:8px; margin-right:10px; background:#000; color:#fff; border:1px solid var(--border-color);">
        <input type="text" id="set-secret" placeholder="Secret Number" style="padding:8px; margin-right:10px; background:#000; color:#fff; border:1px solid var(--border-color);">
        <input type="text" id="set-group" placeholder="Group Name (e.g. BANGLADESH TOPI)" style="padding:8px; margin-right:10px; background:#000; color:#fff; border:1px solid var(--border-color);">
        <button onclick="saveTalent()" style="padding:9px 15px; background:var(--accent-green); color:#fff; border:none; cursor:pointer;">Save Talent</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function verifyAdmin() {
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-pass').value;
      socket.emit('admin-login', { email, pass }, (res) => {
        if(res.success) {
          document.getElementById('admin-login-modal').style.display = 'none';
          document.getElementById('app-container').style.display = 'block';
        } else {
          alert(res.message);
        }
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav-menu button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).style.display = 'block';
      event.target.classList.add('active');
    }

    function saveTalent() {
      const uid = document.getElementById('set-uid').value;
      const ign = document.getElementById('set-ign').value;
      const secret = document.getElementById('set-secret').value;
      const groupName = document.getElementById('set-group').value;
      if(!uid || !ign) return alert("Fill in required fields!");
      socket.emit('admin-save-talent', { uid, ign, secret, groupName });
      alert("Talent configuration saved successfully!");
    }

    socket.on('update-dashboard', (data) => {
      const { talents } = data;
      let onlineCount = 0;
      let offlineCount = 0;
      let html = '';

      // Group talents into batches of 5 like your layout screenshot
      let grouped = {};
      for(let uid in talents) {
        let g = talents[uid].group || "Unassigned";
        if(!grouped[g]) grouped[g] = [];
        grouped[g].push(talents[uid]);
        if(talents[uid].status === 'LIVE ON TIME') onlineCount++; else offlineCount++;
      }

      document.getElementById('count-online').innerText = onlineCount;
      document.getElementById('count-offline').innerText = offlineCount;

      for(let groupName in grouped) {
        html += `<div class="group-section">
          <div class="group-header">${groupName} (${grouped[groupName].length})</div>
          <div class="grid-view">`;
        
        grouped[groupName].forEach(t => {
          html += `<div class="cam-card">
            <span class="cam-badge ${t.status === 'LIVE ON TIME' ? 'badge-live' : 'badge-offline'}">${t.status}</span>
            <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#555;">No feed</div>
            <div class="cam-footer">
              <div class="ign">${t.ign}</div>
              <div class="uid">${t.uid} - <a href="/view.html?id=${t.customUrl}" target="_blank" style="color:var(--accent-red)">URL Link</a></div>
            </div>
          </div>`;
        });
        html += `</div></div>`;
      }
      document.getElementById('groups-container').innerHTML = html;
    });
  </script>
</body>
</html>
